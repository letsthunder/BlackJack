<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Blackjack Web-App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <div class="container login-container">
        <h1>Blackjack Casino</h1>
        <p class="subtitle">Bitte logge dich in dein Konto ein</p>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Benutzername</label>
                <input type="text" id="username" placeholder="Dein Spielername" required>
            </div>

            <div class="form-group">
                <label for="password">Passwort</label>
                <input type="password" id="password" placeholder="Passwort (rein fiktiv)" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Einloggen</button>
        </form>
    </div>

    <!-- Das globale Skript für die Nutzerverwaltung -->
    <script src="js/app.js"></script>
    
    <!-- Seitenspezifische Logik (Login) -->
    <script>
        // Sicherheits-Check: Wenn der Nutzer bereits im localStorage existiert,
        // wird er sofort zum Dashboard weitergeleitet, ohne sich neu einzuloggen.
        if (user && user.username) {
            window.location.href = 'dashboard.html';
        }

        // Login-Event abfangen
        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault(); // Verhindert das Neuladen der Seite
            
            const usernameInput = document.getElementById('username').value.trim();

            if (usernameInput !== "") {
                // Nutzerobjekt erstellen (jeder neue Login startet mit 0€ Guthaben, 
                // das Aufladen soll ja später gezeigt werden)
                user = { 
                    username: usernameInput, 
                    balance: 0 
                };
                
                saveUser(); // Diese Funktion werden wir in der app.js definieren
                window.location.href = 'dashboard.html'; // Weiterleitung zum Menü
            }
        });
    </script>
</body>
</html>
